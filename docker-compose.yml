version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: areal-hr-ext-test-postgres-1
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: hr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: